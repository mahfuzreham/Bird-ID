<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bird ID sound identification interface."><title>Bird Sound ID — Bird ID</title><style>body{font-family:system-ui;margin:0;background:#f4f7f5;color:#16321f}.wrap{max-width:760px;margin:30px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:20px;box-shadow:0 10px 35px #0001}.btn{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.drop{display:block;padding:28px;border:2px dashed #91aa9a;border-radius:16px;text-align:center;margin:14px 0}.result{white-space:pre-wrap;line-height:1.6}</style></head><body><main class="wrap"><div class="card"><p><a href="index.php">← Bird ID</a></p><h1>🔊 Bird Sound ID</h1><p>Upload a short bird recording. The sound provider is kept server-side and must be configured by the administrator.</p><label class="drop">🎙️ Choose audio<input id="audio" type="file" accept="audio/*" hidden></label><button class="btn" onclick="identify()">Identify Sound</button><div id="out" class="result"></div><script>async function identify(){const a=document.getElementById('audio').files[0],out=document.getElementById('out');if(!a){out.textContent='Please choose an audio recording.';return}const f=new FormData();f.append('audio',a);out.textContent='Analyzing sound...';const r=await fetch('sound_id.php',{method:'POST',body:f});const d=await r.json();out.textContent=d.result||d.error||'No result';}</script></div></main></body></html>
